<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 380px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 20px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.9);
      font-family: 'Courier New', monospace;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }
    #startBtn {
      background: #10b981;
      color: white;
      font-size: 14px;
    }
    #startBtn:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    #stopBtn {
      background: #ef4444;
      color: white;
    }
    #stopBtn:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }
    #saveApiKeyBtn {
      width: 100%;
      background: #3b82f6;
      color: white;
      padding: 10px;
      margin-bottom: 12px;
    }
    #saveApiKeyBtn:hover {
      background: #2563eb;
    }
    #status {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      min-height: 18px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .info {
      font-size: 10px;
      opacity: 0.8;
      text-align: center;
    }
    .success { color: #10b981; font-weight: bold; }
    .error { color: #ef4444; font-weight: bold; }
    .hint {
      font-size: 10px;
      opacity: 0.7;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>E-Bidder Extension</h2>
    
    <label>OpenAI API Key:</label>
    <input type="password" id="apiKey" placeholder="">
    <button id="saveApiKeyBtn">Save API Key</button>
    
    <label>SAP Order IDs (any format):</label>
    <textarea id="orderIds" placeholder=""></textarea>
    <div class="hint"></div>
    
    <div class="button-group">
      <button id="startBtn">START</button>
      <button id="stopBtn">STOP</button>
    </div>
    
    <div id="status">Ready for Bid</div>
    <div class="info">Developed by Vinayak</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
